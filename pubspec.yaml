name: narcseal_app
description: "NarcSeal — Forensic Drug Test Evidence Sealing App for the Narcotics Control Bureau. Every Test Sealed. Every Result Defensible."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.1.0
  shared_preferences: ^2.2.0
  flutter_secure_storage: ^9.0.0
  uuid: ^4.2.0
  intl: ^0.19.0
  video_player: ^2.10.1
  local_auth: ^2.3.0
  http: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/branding/
    - assets/images/backgrounds/
    - assets/images/overlays/
    - assets/images/illustrations/
    - assets/images/icons/
    - assets/images/mockups/
    - assets/images/onboarding/
    - assets/videos/
